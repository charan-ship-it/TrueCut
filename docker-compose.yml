# The whole stack on one machine, the same shape as production:
#   docker compose --profile full up --build      → http://localhost:3100
# Postgres and a MinIO bucket are included. Keys come from your .env.local (never baked into the image).
# For everyday development you only need the database:  docker compose up -d db
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: truecut, POSTGRES_PASSWORD: truecut, POSTGRES_DB: truecut }
    ports: ["5432:5432"]
    volumes: [db:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U truecut"], interval: 3s, retries: 20 }

  bucket:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: truecut, MINIO_ROOT_PASSWORD: truecut-secret }
    ports: ["9000:9000", "9001:9001"]
    volumes: [bucket:/data]
    profiles: [full]

  bucket-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [bucket]
    entrypoint: ["sh", "-c", "until mc alias set local http://bucket:9000 truecut truecut-secret; do sleep 1; done; mc mb -p local/truecut"]
    profiles: [full]

  web:
    build: .
    command: ["web"]
    env_file: [{ path: .env.local, required: false }]
    environment: &app
      DATABASE_URL: postgresql://truecut:truecut@db:5432/truecut
      TRUECUT_QUEUE: pgboss
      S3_ENDPOINT: http://bucket:9000
      S3_BUCKET: truecut
      S3_ACCESS_KEY_ID: truecut
      S3_SECRET_ACCESS_KEY: truecut-secret
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      NEXTAUTH_URL: http://localhost:3100
    ports: ["3100:3100"]
    depends_on: { db: { condition: service_healthy }, bucket-init: { condition: service_completed_successfully }, migrate: { condition: service_completed_successfully } }
    profiles: [full]

  worker:
    build: .
    command: ["worker"]
    env_file: [{ path: .env.local, required: false }]
    environment: *app
    depends_on: { db: { condition: service_healthy }, bucket-init: { condition: service_completed_successfully }, migrate: { condition: service_completed_successfully } }
    profiles: [full]

  migrate:
    build: .
    command: ["migrate"]
    environment: *app
    depends_on: { db: { condition: service_healthy } }
    profiles: [full]

volumes: { db: {}, bucket: {} }
